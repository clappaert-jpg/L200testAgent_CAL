[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuwait-cal-agent"
version = "2.0.0"
description = "Kuwait Consulting Account Lead (CAL) Executive Priority Dashboard Agent in Python ADK 2.x with Strategic Model Routing (gemini-3.8-flash & gemini-3.1-pro), Persistent SQLite Session Memory, Context Compaction, Async Memory Consolidation, OpenTelemetry Tracing, PII Redaction, and Golden Dataset Evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Willem Clappaert", email = "clappaert@google.com" }
]
dependencies = [
  "google-adk>=2.0.0",
  "google-genai>=1.0.0",
  "pydantic>=2.6.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "python-json-logger>=2.0.7",
  "structlog>=24.1.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "tenacity>=8.2.0",
  "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kuwait_cal_agent*"]
