[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuwait-cal-agent"
version = "1.0.0"
description = "Kuwait Consulting Account Lead (CAL) Executive Priority Dashboard Agent in Python ADK (google-adk 2.x)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Willem Clappaert", email = "clappaert@google.com" }
]
dependencies = [
  "google-adk>=2.6.0",
  "google-genai>=1.0.0",
  "pydantic>=2.6.0",
  "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
