name: Kuwait CAL ADK Agent CI & Golden Dataset Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests-and-golden-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit & Integration Test Suite
        run: python3 -m unittest discover -s tests -v

      - name: Run Golden Dataset Regression Evaluation Gate (>= 0.95)
        run: python3 evals/run_eval.py --min-score 0.95
